[build-system]
# >=77: the floor that understands PEP 639 (SPDX license + license-files).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-code-msp"
version = "1.3.0"
description = "Generated Python wire types for the Muse Session Protocol (MSP). No hand-written protocol types, ever."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Zero runtime dependencies: stdlib typing only.
dependencies = []
classifiers = [
    # Alpha states the withheld promise: publication is permitted, but the
    # stability promise and conformance claim stay withheld — experimental
    # surfaces may change.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
# The mirror is the one public venue; a published manifest never
# names the private producer repository.
Homepage = "https://github.com/meta-models/muse-code-sdk"
Repository = "https://github.com/meta-models/muse-code-sdk"
Issues = "https://github.com/meta-models/muse-code-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muse_code_msp = ["py.typed"]
