[build-system]
# >=77: the floor that understands PEP 639 (SPDX license + license-files).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-code-sdk"
version = "1.4.12"
description = "Muse Code SDK for MSP: asyncio-first facade over the generated wire types (muse-code-msp), with a thin sync wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Two runtime dependencies, both exact-pinned. pydantic is the deliberate,
# ruled supply-chain exception; bumps are deliberate reviewed PRs.
# muse-code-msp is the companion wire-types package generated and released
# from the same tree, so its pin is this package's own version: a plain
# `pip install muse-code-sdk` must import, and the release bump moves this
# package's version and its muse-code-msp pin together; pydantic bumps stay
# reviewed PRs (test_publish_shape pins the pairing).
dependencies = ["pydantic==2.13.5", "muse-code-msp==1.4.12"]
classifiers = [
    # Alpha states the withheld promise: publication is permitted, but the
    # stability promise and conformance claim stay withheld — experimental
    # surfaces may change.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
# The mirror is the one public venue; a published manifest never
# names the private producer repository.
Homepage = "https://github.com/meta-models/muse-code-sdk"
Repository = "https://github.com/meta-models/muse-code-sdk"
Issues = "https://github.com/meta-models/muse-code-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muse_code = ["py.typed"]
